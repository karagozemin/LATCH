name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: stellar/stellar-cli@v27.0.0
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Run protocol spike tests
        run: |
          for crate in spike-reentry spike-s1 spike-s2 spike-s3 spike-s6; do
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/protocol-spikes" \
              cargo test --manifest-path "$crate/Cargo.toml" --all-features
          done
      - name: Build optimized WASM and verify generated ABI
        run: |
          stellar contract build --package latch-contract --out-dir artifacts --locked --optimize
          npm run generate:client
          git diff --exit-code -- packages/latch-client

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/latch-demo/package-lock.json
      - run: npm ci
      - run: npm run build:client
      - run: npm run sync:testnet-config
      - name: Verify generated site inputs
        run: git diff --exit-code -- sites/latch-demo/vendor sites/latch-demo/src/testnet-config.ts
      - run: npm ci --prefix sites/latch-demo
      - run: npm run build:site
      - name: Verify committed demo bundle
        run: git diff --exit-code -- sites/latch-demo/dist/app.js
